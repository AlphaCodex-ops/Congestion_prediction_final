[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-congestion-prediction"
version = "0.1.0"
description = "A congestion-prediction and routing-control research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
congestion-project = "congestion_project.cli:main"

[tool.setuptools.packages.find]
include = ["congestion_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["congestion_project"]
